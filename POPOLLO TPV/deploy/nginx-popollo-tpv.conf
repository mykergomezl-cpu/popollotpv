# /etc/nginx/sites-available/popollo-tpv  (cambia caja.tudominio.es por tu dominio)
# Después: certbot --nginx -d caja.tudominio.es   (añade el HTTPS automáticamente)
server {
    listen 80;
    server_name caja.tudominio.es;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # El simulador de Hacienda es solo interno
    location = /__aeat-simulador { return 404; }
}
